# Optional private UI; run alongside compose.yaml.
services:
  stowarr-approvals:
    build: .
    user: "${PUID:-1000}:${PGID:-10}"
    entrypoint: ["python", "/app/src/approval_web.py"]
    env_file:
      - .env.approvals
    volumes:
      - ./data:/app/data
    ports:
      - "${STOWARR_APPROVAL_BIND:-127.0.0.1}:8787:8787"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64

  stowarr-staging:
    build: .
    environment:
      STOWARR_RADARR_DOWNLOAD_CLIENT_ID: "2"
      STOWARR_QBITTORRENT_URL: "http://gluetun:8090"
      STOWARR_QBITTORRENT_CATEGORY: "stowarr"
      STOWARR_REPLACEMENT_CATEGORY: "${STOWARR_REPLACEMENT_CATEGORY:-stowarr-replacement}"
      STOWARR_REPLACEMENT_PATH: "${STOWARR_REPLACEMENT_PATH:-}"
      STOWARR_RADARR_ROOT_PATH_MAP: "${STOWARR_RADARR_ROOT_PATH_MAP:-}"
      STOWARR_VERIFY_WORKERS: "${STOWARR_VERIFY_WORKERS:-4}"
      STOWARR_VERIFY_MAX_BYTES: "${STOWARR_VERIFY_MAX_BYTES:-17179869184}"
      STOWARR_VERIFY_MAX_SECONDS: "${STOWARR_VERIFY_MAX_SECONDS:-1800}"
    user: "${PUID:-1000}:${PGID:-10}"
    entrypoint: ["python", "/app/src/movie_staging_executor.py"]
    env_file:
      - .env
      - .env.approvals
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    networks:
      - arr-stack_default
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64

networks:
  arr-stack_default:
    external: true
