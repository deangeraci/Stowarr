# Optional private UI; run alongside compose.yaml.
services:
  stowarr-approvals:
    build: .
    user: "${PUID:-1000}:${PGID:-10}"
    entrypoint: ["python", "/app/src/approval_web.py"]
    env_file:
      - .env.approvals
    volumes:
      - ./data:/app/data
    ports:
      - "${STOWARR_APPROVAL_BIND:-127.0.0.1}:8787:8787"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, sys;
          conn = http.client.HTTPConnection("127.0.0.1", 8787, timeout=2);
          conn.request("GET", "/");
          sys.exit(conn.getresponse().status != 401)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64

  stowarr-staging:
    build: .
    environment:
      STOWARR_RADARR_DOWNLOAD_CLIENT_ID: "2"
      STOWARR_QBITTORRENT_URL: "http://gluetun:8090"
      STOWARR_QBITTORRENT_CATEGORY: "stowarr"
    user: "${PUID:-1000}:${PGID:-10}"
    entrypoint: ["python", "/app/src/movie_staging_executor.py"]
    env_file:
      - .env
      - .env.approvals
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    networks:
      - arr-stack_default
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64

networks:
  arr-stack_default:
    external: true
